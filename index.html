<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Text to Morse</title>
</head>
<body>
    <div class="container">
        <div class="container-translate">
            <div class="content-text-area">
                <div class="infos">
                    <h2>Text</h2>
                    <div class="labels">
                        <label for="" class="label">SOS</label>
                        <label for="" class="label">Hello Word</label>
                        <label for="" class="label">Paris</label>
                    </div>
                </div>
                <div class="insert-text">
                    <textarea name="" id="text-field"></textarea>
                </div>
            </div>
            <button id="btn_translate">Test</button>
            <div class="content-text-area">
                <div class="infos">
                    <h2>Morse Code</h2>
                </div>
                <div class="response-info">
                    <textarea name="" id="response-field" readonly></textarea>
                </div>
            </div>
        </div>
        <div class="btn_actions">
            <div class="btn_list">
                <button class="btn activate">Play</button>
                <button class="btn">Repeat</button>
                <button class="btn activate">Sound</button>
                <button class="btn activate">Light</button>
                <button class="btn">Vibrate</button>
            </div>
            <div class="btn_list">
                <button class="btn">Copy</button>
                <button class="btn">Share</button>
                <button class="btn">TXT</button>
                <button class="btn">Random</button>
                <button class="btn">Clear</button>
                <div class="special-btn">
                    <div class="around-circle">
                        <div class="circle"></div>
                    </div>
                    <div class="anothers-infos">
                        <h3>Ready</h3>
                        <p>7.4 s .18 wpm</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="adjust">
            <div class="config">
                <div class="label-config">
                    <h3>SPEED</h3>
                    <h5 id="value-speed"></h5>
                </div>
                <input id="input-speed" type="range" min="0" max="100">
            </div>
            <div class="config">
                <div class="label-config">
                    <h3>TONE</h3>
                    <h5 id="value-tone"></h5>
                </div>
                <input id="input-tone" type="range" min="0" max="1000">
            </div>
            <div class="config">
                <div class="label-config">
                    <h3>VOLUME</h3>
                    <h5 id="value-volume"></h5>
                </div>
                <input id="input-volume" type="range" min="0" max="100">
            </div>
        </div>
        <div class="frequency">
            <div class="frequency-info">
                <h3>SIGNAL TIMELINE</h3>
                <div class="explain">
                    <div class="info-item">
                        <div class="item-dit"></div>
                        <p>dit</p>
                    </div>
                    <div class="info-item">
                        <div class="item-dah"></div>
                        <p>dah</p>
                    </div>
                    <div class="info-item">
                        <div class="item-silence"></div>
                        <p>silence</p>
                    </div>
                </div>
            </div>
            <div class="timeline-frequency">
                <div class="frequency-elements">
                </div>
            </div>
        </div>
    </div>
</body>
<script src="script.js" defer></script>
</html>
